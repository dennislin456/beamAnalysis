<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1460" viewBox="0 0 1100 1460">
  <rect width="1100" height="1460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5560"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; fill: #243038; }
    .title { font-size: 28px; font-weight: 700; }
    .box { fill: #f7f8fa; stroke: #8b97a3; stroke-width: 1.5; }
    .result { fill: #e8f0ea; stroke: #5d8a68; stroke-width: 1.5; }
    .out { fill: #eef3f8; stroke: #5d7590; stroke-width: 1.5; }
    .label { font-size: 16px; }
    .edge { font-size: 14px; fill: #3d4a55; }
    .note { font-size: 14px; fill: #3d4a55; }
    path.wire { stroke: #4a5560; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <text class="title" x="550" y="40" text-anchor="middle">HDR 總流程</text>
  <rect class="box" x="360" y="62" width="380" height="48" rx="8"/>
  <text class="label" x="550" y="92" text-anchor="middle">勾選的曝光影像和曝光時間</text>
  <path class="wire" d="M 550 110 V 142"/>
  <rect class="box" x="390" y="142" width="320" height="48" rx="8"/>
  <text class="label" x="550" y="172" text-anchor="middle">檢查張數、尺寸、時間</text>
  <path class="wire" d="M 550 190 V 222"/>
  <rect class="box" x="430" y="222" width="240" height="48" rx="8"/>
  <text class="label" x="550" y="252" text-anchor="middle">壓成 8-bit</text>
  <path class="wire" d="M 550 270 V 302"/>
  <rect class="box" x="390" y="302" width="320" height="48" rx="8"/>
  <text class="label" x="550" y="332" text-anchor="middle">灰階複製成三通道</text>
  <path class="wire" d="M 550 350 V 384"/>
  <polygon points="550,384 668,448 550,512 432,448" fill="#fff8ec" stroke="#c4a15a" stroke-width="1.5"/>
  <text class="label" x="550" y="454" text-anchor="middle">演算法</text>
  <path class="wire" d="M 432 448 H 200 V 528"/>
  <text class="edge" x="216" y="438">Debevec 或 Robertson</text>
  <rect class="box" x="40" y="528" width="320" height="52" rx="8"/>
  <text class="label" x="200" y="560" text-anchor="middle">用曝光時間估計響應曲線</text>
  <path class="wire" d="M 200 580 V 612"/>
  <rect class="box" x="20" y="612" width="360" height="52" rx="8"/>
  <text class="label" x="200" y="644" text-anchor="middle">用響應曲線和曝光時間合成輻射圖</text>
  <path class="wire" d="M 668 448 H 900 V 612"/>
  <text class="edge" x="742" y="438">Mertens</text>
  <rect class="box" x="740" y="612" width="320" height="52" rx="8"/>
  <text class="label" x="900" y="644" text-anchor="middle">依對比、飽和、曝光權重融合</text>
  <path class="wire" d="M 200 664 V 720 H 550 V 752"/>
  <path class="wire" d="M 900 664 V 720 H 550"/>
  <rect class="box" x="390" y="752" width="320" height="48" rx="8"/>
  <text class="label" x="550" y="782" text-anchor="middle">灰階取回一個通道</text>
  <path class="wire" d="M 550 800 V 832"/>
  <rect class="result" x="430" y="832" width="240" height="48" rx="8"/>
  <text class="label" x="550" y="862" text-anchor="middle">浮點結果</text>
  <path class="wire" d="M 430 856 H 230"/>
  <rect class="out" x="40" y="832" width="190" height="48" rx="8"/>
  <text class="label" x="135" y="862" text-anchor="middle">匯出 npy</text>
  <path class="wire" d="M 550 880 V 914"/>
  <polygon points="550,914 668,978 550,1042 432,978" fill="#fff8ec" stroke="#c4a15a" stroke-width="1.5"/>
  <text class="label" x="550" y="984" text-anchor="middle">log</text>
  <path class="wire" d="M 550 1042 V 1148"/>
  <text class="edge" x="562" y="1100">不勾</text>
  <path class="wire" d="M 668 978 H 900 V 1072"/>
  <text class="edge" x="760" y="968">勾選</text>
  <rect class="box" x="740" y="1072" width="300" height="52" rx="8"/>
  <text class="label" x="890" y="1104" text-anchor="middle">log10 熱圖和剖面</text>
  <path class="wire" d="M 890 1124 V 1174 H 750"/>
  <rect class="result" x="250" y="1148" width="500" height="52" rx="8"/>
  <text class="label" x="500" y="1180" text-anchor="middle">熱圖和剖面直接用這個結果</text>
  <path class="wire" d="M 500 1200 V 1240"/>
  <rect class="out" x="380" y="1240" width="240" height="48" rx="8"/>
  <text class="label" x="500" y="1270" text-anchor="middle">匯出預覽</text>
  <text class="note" x="550" y="1360" text-anchor="middle">沒有色調映射。log 不寫進浮點結果。游標讀浮點結果。</text>
</svg>
